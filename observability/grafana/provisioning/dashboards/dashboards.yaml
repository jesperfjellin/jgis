apiVersion: 1

providers:
  - name: jgis
    folder: JGIS
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards

  # Dashboard for the load tests, kept in loadtest/grafana/.
  - name: jgis-loadtest
    folder: JGIS load tests
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards-loadtest
