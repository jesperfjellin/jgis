# k6 load tests against the running stack. Used together with the main compose
# file (see `make loadtest`); paths are relative to the repository root.
services:
  k6:
    mem_limit: ${K6_MEM_LIMIT:-512m}
    image: grafana/k6:2.3.0
    profiles: [loadtest]
    # Writes the summary files into loadtest/results as the host user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /loadtest
    environment:
      K6_NO_USAGE_REPORT: "true"
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_FEATURES: native-histograms
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set in environments/.env}
      # Scenario settings, passed through from `make loadtest VAR=value`.
      VUS:
      DURATION:
      WARMUP:
      SEED:
      COLD_CACHE:
      TILE_FORMAT:
      TILE_LAYERS:
      WMS_LAYERS:
      FEATURE_LAYERS:
      ZOOMS:
      AREAS:
      VIEW_COLS:
      VIEW_ROWS:
      THINK_MIN:
      THINK_MAX:
      BASE_URL:
      WORKSPACE:
      DISCOVERY_AREAS:
      DISCOVERY_SPREAD:
    volumes:
      - ./loadtest:/loadtest
    depends_on:
      geoserver:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  # Builds reports from Prometheus, Loki and the files a run leaves in
  # loadtest/results/. Run by loadtest/run.sh.
  report:
    mem_limit: ${REPORT_MEM_LIMIT:-256m}
    image: python:3.13.15-slim
    profiles: [loadtest]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /loadtest
    entrypoint: ["python", "report/report.py"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      # The database GeoServer reads from, and the role it connects as, for the
      # PostgreSQL sections of the report.
      DB_NAME: ${LOADTEST_DB_NAME:-gis}
      DB_ROLE: ${LOADTEST_DB_ROLE:-geoserver}
    volumes:
      - ./loadtest:/loadtest
    depends_on:
      prometheus:
        condition: service_healthy
