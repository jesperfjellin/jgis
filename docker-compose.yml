name: jgis

x-postgis-env: &postgis-env
  PGHOST: postgis
  PGDATABASE: gis
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}

services:
  postgis:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGIS_PORT:-5440}:5432"
    environment:
      POSTGRES_DB: gis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=all
      - -c
      - auto_explain.log_min_duration=500ms
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
    shm_size: 1g
    volumes:
      - postgis_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot OSM import: `make load-data`.
  loader:
    build: ./data
    profiles: [tools]
    environment:
      <<: *postgis-env
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-https://download.geofabrik.de/europe/norway-latest.osm.pbf}
      OSM2PGSQL_CACHE_MB: ${OSM2PGSQL_CACHE_MB:-1500}
      OSM2PGSQL_PROCESSES: ${OSM2PGSQL_PROCESSES:-4}
    volumes:
      - ./data/cache:/cache
    depends_on:
      postgis:
        condition: service_healthy

  geoserver:
    build:
      context: ./geoserver
      args:
        GEOSERVER_VERSION: ${GEOSERVER_VERSION:-3.0.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8085}:8080"
    environment:
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      ROOT_WEBAPP_REDIRECT: "true"
      CORS_ENABLED: "true"
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set in .env}
      EXTRA_JAVA_OPTS: >-
        ${GEOSERVER_JAVA_OPTS:--Xms1g -Xmx2g}
        -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml
      HEALTHCHECK_URL: http://localhost:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
    volumes:
      - geoserver_data:/opt/geoserver_data
      # Tomcat logs, including the JSON access log read by Alloy.
      - geoserver_logs:/usr/local/tomcat/logs
    depends_on:
      postgis:
        condition: service_healthy

  # Browser client for visual checks. Open the URL printed by `make up`.
  geolibre:
    # Unreleased main-branch build: the deployment service library
    # (GEOLIBRE_SERVICES_FILE) is newer than the v3.0.0 release. Move to the
    # next release tag once it includes it.
    image: ghcr.io/opengeos/geolibre:sha-e9df9e2
    restart: unless-stopped
    # Changes when its bind-mounted config changes (see Makefile), which makes
    # Compose recreate the container.
    labels:
      jgis.config-hash: ${GEOLIBRE_CONFIG_HASH:-}
    entrypoint: ["/opt/jgis/entrypoint.sh"]
    ports:
      - "127.0.0.1:${GEOLIBRE_PORT:-8086}:80"
    environment:
      # Loaded by the browser, so this is the host-side address, not the service name.
      GEOSERVER_URL: http://127.0.0.1:${GEOSERVER_PORT:-8085}/geoserver
      GEOLIBRE_SHARE_URL: "off"
      GEOLIBRE_GEOLENS_URL: "off"
      GEOLIBRE_DISABLE_SIDECAR: "1"
      # Rendered from geolibre/services.json.template by the entrypoint.
      GEOLIBRE_SERVICES_FILE: /tmp/jgis/services.json
      # Hide GeoLibre's built-in sample services; only the JGIS ones are listed.
      GEOLIBRE_BUILTIN_SERVICES: "off"
    volumes:
      - ./geolibre:/opt/jgis:ro

  # --- Observability ---------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    # Changes when its bind-mounted config changes (see Makefile), which makes
    # Compose recreate the container.
    labels:
      jgis.config-hash: ${PROMETHEUS_CONFIG_HASH:-}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # Lets the load tests (loadtest/) push k6 results into Prometheus.
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-8088}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    # Changes when its bind-mounted config changes (see Makefile), which makes
    # Compose recreate the container.
    labels:
      jgis.config-hash: ${LOKI_CONFIG_HASH:-}
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  # Tails the GeoServer access log (request metrics + logs) and all container
  # logs of this Compose project, and ships them to Loki.
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    # Changes when its bind-mounted config changes (see Makefile), which makes
    # Compose recreate the container.
    labels:
      jgis.config-hash: ${ALLOY_CONFIG_HASH:-}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: jgis
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - geoserver_logs:/logs/geoserver:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.stat_statements.limit=50
    environment:
      DATA_SOURCE_URI: postgis:5432/gis?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set in environments/.env}
    depends_on:
      postgis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    # Changes when its bind-mounted config changes (see Makefile), which makes
    # Compose recreate the container.
    labels:
      jgis.config-hash: ${GRAFANA_CONFIG_HASH:-}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-8087}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in environments/.env}
      # Dashboards can be viewed without logging in; editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/geoserver-requests.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./loadtest/grafana:/var/lib/grafana/dashboards-loadtest:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: applies the Terraform-managed GeoServer catalog. Run by `make up`.
  bootstrap:
    image: hashicorp/terraform:1.16.4
    profiles: [tools]
    entrypoint: ["/terraform/bootstrap.sh"]
    environment:
      TF_DATA_DIR: /state/.terraform
      TF_VAR_geoserver_admin_password: ${GEOSERVER_ADMIN_PASSWORD:?set in .env}
      TF_VAR_db_password: ${GEOSERVER_DB_PASSWORD:?set in .env}
    volumes:
      - ./terraform:/terraform
      - terraform_state:/state
    depends_on:
      geoserver:
        condition: service_healthy

volumes:
  postgis_data:
  geoserver_data:
  geoserver_logs:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  terraform_state:
